name: StockRadar production smoke gate

on:
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "scripts/production_smoke_test.py"
      - "tests/test_production_smoke_test.py"
      - "requirements-dev.in"
      - "requirements-dev.txt"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public StockRadar base URL"
        required: true
        default: "https://www.stockradarhq.com"
        type: string

permissions:
  contents: read

jobs:
  verify-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_production_smoke_test.py
      - run: python scripts/production_smoke_test.py --self-test

  production-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run read-only production browser smoke gate
        env:
          STOCKRADAR_SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: python scripts/production_smoke_test.py
